<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대대 일정 및 데이터 공유</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 p-4 max-w-md mx-auto">

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h1 class="text-xl font-bold text-gray-800 mb-4">대대 실시간 공유 보드</h1>
        
        <!-- 입력폼 -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="todoInput" placeholder="내용을 입력하세요..." class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
            <button onclick="saveData()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-700 transition">등록</button>
        </div>

        <!-- 리스트 출력 영역 -->
        <ul id="todoList" class="space-y-2.5">
            <li class="text-gray-400 text-sm text-center py-4">데이터를 불러오는 중입니다...</li>
        </ul>
    </div>

    <!-- Firebase SDK (모듈형 CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 발급받으신 파이어베이스 설정값 적용 완료
        const firebaseConfig = {
            apiKey: "AIzaSyAAyS5YnmEasue7mLDvJmXKbtct-oF5FtY",
            authDomain: "biryongedu.firebaseapp.com",
            databaseURL: "https://biryongedu-default-rtdb.firebaseio.com",
            projectId: "biryongedu",
            storageBucket: "biryongedu.firebasestorage.app",
            messagingSenderId: "499453091355",
            appId: "1:499453091355:web:1e5ad6ea1fbedf3bc7e2be",
            measurementId: "G-VW9FDYJYM9"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 데이터 저장 함수
        window.saveData = function() {
            const input = document.getElementById('todoInput');
            const value = input.value.trim();
            if (!value) return;

            const listRef = ref(db, 'items');
            const newItemRef = push(listRef);
            set(newItemRef, {
                text: value,
                timestamp: Date.now()
            });

            input.value = '';
        };

        // 실시간으로 데이터 불러오기 및 화면 갱신
        const listRef = ref(db, 'items');
        onValue(listRef, (snapshot) => {
            const ul = document.getElementById('todoList');
            ul.innerHTML = '';

            const data = snapshot.val();
            if (!data) {
                ul.innerHTML = '<li class="text-gray-400 text-sm text-center py-4">등록된 내용이 없습니다.</li>';
                return;
            }

            Object.entries(data).forEach(([key, val]) => {
                const li = document.createElement('li');
                li.className = "bg-gray-50 border border-gray-100 p-3.5 rounded-xl text-sm text-gray-700 flex justify-between items-center";
                li.textContent = val.text;
                ul.prepend(li); // 최신 글이 위로 오도록
            });
        });
    </script>
</body>
</html>
